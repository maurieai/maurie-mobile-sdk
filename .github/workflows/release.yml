# A version tag (0.1.0, 0.2.0 …) makes a GitHub Release with the Android library attached and, when the NPM_TOKEN
# secret is set, publishes the React Native package to npm. iOS and Flutter install from the tag itself.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # By hand: publishes the React Native package only (e.g. once the NPM_TOKEN secret has been added after a tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android library
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon :maurie-chat:assembleRelease
      - name: GitHub Release with the .aar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp maurie-chat/build/outputs/aar/maurie-chat-release.aar "maurie-chat-${GITHUB_REF_NAME}.aar"
          gh release create "$GITHUB_REF_NAME" "maurie-chat-${GITHUB_REF_NAME}.aar" --title "$GITHUB_REF_NAME" --generate-notes

  npm:
    name: React Native package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: The tag must be the package's version
        if: github.event_name == 'push'
        run: test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - name: Publish (skipped until the NPM_TOKEN secret exists)
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "No NPM_TOKEN secret - not published."; exit 0; fi
          npm publish --access public
